---
jobs:
  update:
    name: Update
    runs-on: ubuntu-24.04
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          owner: techbymatt
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}
      - name: Checkout update branch
        run: git checkout -B actions/update-submodule
      - name: Update submodules
        run: git submodule update --init --remote
      - name: Commit changes
        id: commit
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "TBM VyOS[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: update submodules"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Push update branch
        if: steps.commit.outputs.changed == 'true'
        run: git push --force-with-lease origin actions/update-submodule
      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        name: Open pull request
        if: steps.commit.outputs.changed == 'true'
        run: |
          if [ -z "$(gh pr list --head actions/update-submodule --state open --json number --jq '.[0].number')" ]; then
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head actions/update-submodule \
              --title "chore: update submodules" \
              --body "Updates submodules to their latest configured remote revisions." \
              --assignee MattKobayashi
          fi
      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        name: Enable auto-merge
        if: steps.commit.outputs.changed == 'true'
        run: |
          gh pr merge --auto --squash actions/update-submodule
name: Submodules
on:
  schedule:
    - cron: "42 19 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
