---
name: "Build TBM VyOS Package Repository"

on:
  workflow_dispatch:

jobs:
  create-runner:
    name: Create self-hosted runner
    runs-on: ubuntu-latest
    steps:
      - name: Create self-hosted runner
        uses: MattKobayashi/tailscale-runner-action@v1.1.5
        with:
          gh-app-id: ${{ secrets.GH_APP_ID }}
          gh-app-login: MattKobayashi
          gh-app-private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          runner-network: mattflix
          ssh-host: 100.102.37.118
          ssh-user: matthew
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          ts-tag: ci
  build-repo:
    name: Build packages and repository
    runs-on: self-hosted
    container:
      image: vyos/vyos-build:current
      env:
        TZ: Australia/Brisbane
    steps:
      - name: Checkout the `vyos-pkg` repository
        run: |
          set -eux
          rm -rf vyos-pkg/
          git clone --depth 1 https://github.com/MattKobayashi/vyos-pkg.git
      - name: Checkout the `vyos-build` repository
        run: |
          set -eux
          rm -rf vyos-build/
          git clone --depth 1 https://github.com/vyos/vyos-build.git
      - name: Build the packages
        working-directory: vyos-build/scripts/package-build
        run: |
          set -eux
          for dir in */; do
            if [ -f "${dir}build.py" ]; then
              (cd "$dir" && ./build.py)
            fi
          done
      # - name: "Remove old .deb files from the `vyos-pkg` repository"
      #   working-directory: vyos-pkg
      #   run: |
      #     set -eux
      #     find packages/current/ -name 'libyang*.deb' -exec git rm {} \;
      #     find packages/current/ -name 'librtr*.deb' -exec git rm {} \;
      #     find packages/current/ -name 'frr*.deb' -exec git rm {} \;
      #     find packages/current/ -name 'rtr-tools*.deb' -exec git rm {} \;
      - name: Copy the .deb files to the `vyos-pkg` repository
        working-directory: vyos-pkg
        run: |
          set -eux
          mkdir -p packages/current/
          find ../vyos-build/scripts/package-build/ -name '*.deb' -exec cp {} packages/current/ \;
      - name: Build the Debian repository
        working-directory: vyos-pkg
        run: |
          set -eux
          .github/scripts/build_repo.sh
      - name: Install required packages
        run: |
          set -eux
          until sudo apt-get update
          do
            sleep 1
          done
          sudo apt-get install --yes \
            jq \
            createrepo-c \
            coreutils \
            gnupg2 \
            dpkg-dev
      - name: Insert environment variables
        run: |
          set -eux
          echo GNUPGHOME="$(mktemp -d /tmp/pgpkeys-XXXXXX)" >> $GITHUB_ENV
          echo REPO_OWNER="$(echo ${GITHUB_REPOSITORY} | cut -d/ -f1)" >> $GITHUB_ENV
          echo REPO_NAME="$(echo ${GITHUB_REPOSITORY} | cut -d/ -f2)" >> $GITHUB_ENV
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6.2.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Confirm GPG Key is loaded
        run: |
          set -eux
          gpg --list-keys
          echo "${{ steps.import_gpg.outputs.fingerprint }}"
      - name: Setup Pages
        uses: actions/configure-pages@v5.0.0
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1.0.13
        with:
          source: ./
          destination: ./_site
      - name: Build .deb repository
        run: |
          set -eux
          export GPG_FINGERPRINT="${{ steps.import_gpg.outputs.fingerprint }}"
          export ORIGIN="${{ steps.import_gpg.outputs.name }}"
          .github/scripts/build_repo.sh
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3.0.1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
