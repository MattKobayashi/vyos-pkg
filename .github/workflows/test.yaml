---
# $schema: https://json.schemastore.org/github-workflow.json
jobs:
  setup-matrix:
    name: Setup matrix
    outputs:
      package: ${{ steps.container.outputs.json }}
    runs-on: ubuntu-24.04
    steps:
      - id: container
        name: Parse container package list
        run: |
          input='${{ inputs.package }}'
          if ! printf '%s' "$input" | grep -qE '[^,[:space:]]+'; then
            json='[]'
          else
            json=$(printf '%s' "$input" | grep -oE '[^,[:space:]]+' | jq -R . | jq -sc .)
          fi
          echo "json=$json" >> "$GITHUB_OUTPUT"
    timeout-minutes: 5
  build:
    container:
      env:
        TZ: Australia/Brisbane
      image: ghcr.io/techbymatt/vyos-build:rolling
      options: "--privileged --sysctl net.ipv6.conf.lo.disable_ipv6=0"
    defaults:
      run:
        shell: bash
    name: Build (container)
    needs: [setup-matrix]
    permissions:
      packages: read
    runs-on: ${{ matrix.runner_label }}
    steps:
      - id: checkout
        name: Checkout the vyos-build repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: vyos-build
          ref: rolling
          repository: vyos/vyos-build
      - id: checkout_patch
        name: Checkout the tbm-vyos-patch repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: tbm-vyos-patch
          ref: main
          repository: techbymatt/tbm-vyos-patch
          token: ${{ secrets.TBM_VYOS_PATCH_TOKEN }}
      - id: patch_vyos_build
        name: Patch vyos-build
        run: |
          cp --verbose ../tbm-vyos-patch/patches/vyos-build/*.patch .
          git apply *.patch
        working-directory: vyos-build
      - name: Setup golang
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.4"
      - name: Build the package
        run: |
          python3 build.py
        working-directory: vyos-build/scripts/package-build/${{ matrix.package }}
      - name: List the .deb files built
        run: |
          ls -halp vyos-build/scripts/package-build/**/*.deb
      - name: Upload the .deb files as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: deb-${{ matrix.package }}-${{ matrix.arch }}
          path: |
            vyos-build/scripts/package-build/**/*.deb
      - name: Upload the remaining build files as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.package }}-${{ matrix.arch }}
          path: |
            vyos-build/scripts/package-build/**/*.buildinfo
            vyos-build/scripts/package-build/**/*.changes
            vyos-build/scripts/package-build/**/*.dsc
            vyos-build/scripts/package-build/**/*debian.tar.*
            vyos-build/scripts/package-build/**/*orig.tar.*
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        package: ${{ fromJson(needs.setup-matrix.outputs.package) }}
        include:
          - arch: amd64
            runner_label: ubuntu-24.04
          - arch: arm64
            runner_label: ubuntu-24.04-arm
    timeout-minutes: 150
  publish:
    name: Publish
    if: ${{ always() && needs.setup-matrix.result == 'success' && needs.build.result == 'success' }}
    needs:
      - setup-matrix
      - build
    permissions:
      id-token: write
      pages: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the vyos-pkg repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Download the .deb file artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          path: packages/rolling
          pattern: deb-*
      - name: Download the build file artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          path: packages/rolling
          pattern: build-*
      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get --no-install-recommends --yes install \
            jq \
            createrepo-c \
            coreutils \
            gnupg2 \
            dpkg-dev
      - name: Insert environment variables
        run: |
          {
            echo GNUPGHOME="$(mktemp -d /tmp/pgpkeys-XXXXXX)"
            echo REPO_OWNER="$(echo "${GITHUB_REPOSITORY}" | cut -d/ -f1)"
            echo REPO_NAME="$(echo "${GITHUB_REPOSITORY}" | cut -d/ -f2)"
          } >> "$GITHUB_ENV"
      - id: import_gpg
        name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Confirm GPG key is loaded
        run: |
          gpg --list-keys | grep "${{ steps.import_gpg.outputs.fingerprint }}"
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
      - name: Build .deb repository
        run: |
          export GPG_FINGERPRINT="${{ steps.import_gpg.outputs.fingerprint }}"
          export ORIGIN="${{ steps.import_gpg.outputs.name }}"
          sudo chown -R "$(whoami):$(whoami)" _site/
          scripts/build_repo.sh
      - name: Delete scripts/ repo
        run: |
          rm -r scripts
      - name: Generate directory indices
        uses: gacts/directory-listing@382b3439bf3a5787b20350780a0cc18553a47acd # v1.0.4
        with:
          show-hidden: true
          target: _site/deb
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
    timeout-minutes: 30
name: Test
on:
  workflow_dispatch:
    inputs:
      package:
        description: A comma-separated list of packages to be built using the vyos-build container
        required: false
        type: string
permissions:
  contents: read
