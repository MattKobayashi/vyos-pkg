---
jobs:
  test-package:
    container:
      env:
        TZ: Australia/Brisbane
      image: vyos/vyos-build:current@sha256:5a2284687d6d55793404dcf4b8d7f3f7088856b4e68a59010d1817af0d293370
    name: Package build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the `vyos-build` repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: vyos-build
          ref: current
          repository: vyos/vyos-build
      - if: (matrix.package == 'podman')
        name: Setup golang
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.24.3"
      - env:
          DEB_BUILD_OPTIONS: ${{ matrix.package == 'kea' && 'parallel=1' || 'parallel=auto' }}
        name: Build the package
        working-directory: vyos-build/scripts/package-build/${{ matrix.package }}
        run: |
          set -eux
          sudo apt-get update
          python3 build.py
      - name: Upload the .deb files as artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          if-no-files-found: error
          name: ${{ matrix.package }}
          path: vyos-build/scripts/package-build/${{ matrix.package }}/*.deb
    strategy:
      fail-fast: true
      matrix:
        package:
          - frr_exporter
  test-package-nocontainer:
    name: Package build (no container)
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: |
          set -eux
          python3 -m pip install toml
          sudo apt-get update
          sudo apt-get --no-install-recommends --yes install \
            devscripts \
            equivs
      - name: Checkout the `vyos-build` repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: vyos-build
          ref: current
          repository: vyos/vyos-build
      - if: (matrix.package == 'amazon-cloudwatch-agent') || (matrix.package == 'amazon-ssm-agent')
        name: Setup golang
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.24.3"
      - name: Build the package
        working-directory: vyos-build/scripts/package-build/${{ matrix.package }}
        run: |
          set -eux
          python3 build.py
      - name: Upload the .deb files as artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          if-no-files-found: error
          name: ${{ matrix.package }}
          path: vyos-build/scripts/package-build/${{ matrix.package }}/*.deb
    strategy:
      fail-fast: false
      matrix:
        package:
          - hsflowd
  test-repo:
    name: .deb repository build
    needs:
      - test-package
      - test-package-nocontainer
    permissions:
      id-token: write
      pages: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the `vyos-pkg` repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download the .deb file artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true
          path: packages/current
      - name: Install required packages
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get --no-install-recommends --yes install \
            jq \
            createrepo-c \
            coreutils \
            gnupg2 \
            dpkg-dev
      - name: Insert environment variables
        run: |
          set -eux
          echo GNUPGHOME="$(mktemp -d /tmp/pgpkeys-XXXXXX)" >> $GITHUB_ENV
          echo REPO_OWNER="$(echo ${GITHUB_REPOSITORY} | cut -d/ -f1)" >> $GITHUB_ENV
          echo REPO_NAME="$(echo ${GITHUB_REPOSITORY} | cut -d/ -f2)" >> $GITHUB_ENV
      - id: import_gpg
        name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Confirm GPG key is loaded
        run: |
          set -eux
          gpg --list-keys | grep $(echo "${{ steps.import_gpg.outputs.fingerprint }}")
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
      - name: Build .deb repository
        run: |
          set -eux
          export GPG_FINGERPRINT="${{ steps.import_gpg.outputs.fingerprint }}"
          export ORIGIN="${{ steps.import_gpg.outputs.name }}"
          sudo chown -R $(whoami):$(whoami) _site/
          scripts/build_repo.sh
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          path: "_site/"
name: "Build TBM VyOS Package Repository"
on:
  pull_request:
    branches:
      - current
    paths:
      - "**.sh"
      - "**.yaml"
      - "**.yml"
  workflow_dispatch:
