---
jobs:
  build:
    container:
      env:
        TZ: Australia/Brisbane
      image: ghcr.io/techbymatt/vyos-build:rolling
      options: "--privileged --sysctl net.ipv6.conf.lo.disable_ipv6=0"
    defaults:
      run:
        shell: bash
    name: Build (container)
    permissions:
      packages: read
    runs-on: ${{ matrix.runner_label }}
    steps:
      - name: Download patch files
        env:
          GH_TOKEN: ${{ secrets.TBM_VYOS_PATCH_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "TBM_VYOS_PATCH_TOKEN is required to read techbymatt/tbm-vyos-patch" >&2
            exit 1
          fi

          sudo apt update
          sudo apt install --no-install-recommends --yes gh

          mkdir patch/
          for file in \
            vyos-1x_changes.patch \
            vyos-1x_new.patch \
            vyos-build_changes.patch \
            vyos-build_new.patch; do
            gh api \
              --header "Accept: application/vnd.github.raw" \
              "/repos/techbymatt/tbm-vyos-patch/contents/${file}" \
              > "patch/${file}"
          done

          echo ""
          echo "Contents of $(pwd)/patch:"
          ls -halp patch/
      - name: Checkout the vyos-build repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: vyos-build
          ref: rolling
          repository: vyos/vyos-build
      - id: patch_vyos_build
        name: Patch vyos-build
        run: |
          patch -p1 < ../patch/vyos-build_changes.patch
          patch -p1 < ../patch/vyos-build_new.patch
        working-directory: vyos-build
      - name: Setup golang
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.4"
      - name: Build the package
        run: |
          sudo apt-get update
          python3 build.py
        working-directory: vyos-build/scripts/package-build/${{ matrix.package }}
      - name: Upload the .deb files as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: ${{ matrix.package }}
          path: |
            vyos-build/scripts/package-build/${{ matrix.package }}/*.changes
            vyos-build/scripts/package-build/${{ matrix.package }}/*.deb
            vyos-build/scripts/package-build/${{ matrix.package }}/*.dsc
            vyos-build/scripts/package-build/${{ matrix.package }}/*.tar.bz2
            vyos-build/scripts/package-build/${{ matrix.package }}/*.tar.gz
            vyos-build/scripts/package-build/${{ matrix.package }}/*.tar.xz
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        package:
          - amazon-cloudwatch-agent
          - amazon-ssm-agent
          - aws-gwlbtun
          - bash-completion
          - blackbox_exporter
          - ddclient
          - dropbear
          - ethtool
          - frr
          - frr_exporter
          - hostap
          - hsflowd
          - isc-dhcp
          - isc-kea
          - keepalived
          - libnss-mapuser
          - libpam-radius-auth
          - linux-kernel
          - ndppd
          - net-snmp
          - netfilter
          - node_exporter
          - openvpn-otp
          - podman
          - pyhumps
          - radvd
          - salt
          - tacacs
          - telegraf
          - udp-broadcast-relay
          - unionfs-fuse
          - vpp
          - vyos-1x
          - waagent
          - wide-dhcpv6
          - xen-guest-agent
          - zerotier-one
        include:
          - arch: amd64
            runner_label: ubuntu-24.04
          - arch: arm64
            runner_label: ubuntu-24.04-arm
    timeout-minutes: 180
  build-extra:
    container:
      env:
        TZ: Australia/Brisbane
      image: ghcr.io/techbymatt/vyos-build:rolling
      options: "--privileged --sysctl net.ipv6.conf.lo.disable_ipv6=0"
    defaults:
      run:
        shell: bash
    name: Build (extra)
    permissions:
      packages: read
    runs-on: ${{ matrix.runner_label }}
    steps:
      - name: Checkout the package repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: packages/${{ matrix.package }}
          ref: rolling
          repository: vyos/${{ matrix.package }}
      - if: ${{ matrix.deps }}
        name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ${{ matrix.deps }}
      - name: Build the package
        run: |
          sudo apt-get update
          ${{ matrix.cmd }}
        working-directory: packages/${{ matrix.package }}
      - name: Upload the .deb files as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: ${{ matrix.package }}
          path: |
            packages/*.changes
            packages/*.deb
            packages/*.dsc
            packages/*.tar.bz2
            packages/*.tar.gz
            packages/*.tar.xz
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        package:
          - hvinfo
          - ipaddrcheck
          - libnss-mapuser
          - libnss-tacplus
          - libpam-radius-auth
          - libpam-tacplus
          - libtacplus-map
          - live-boot
          - vyatta-bash
          - vyatta-biosdevname
          - vyatta-cfg
        include:
          - arch: amd64
            runner_label: ubuntu-24.04
          - arch: arm64
            runner_label: ubuntu-24.04-arm
          - cmd: dpkg-buildpackage -uc -us -tc -b
            deps: gnat gprbuild
            package: hvinfo
          - cmd: dpkg-buildpackage -uc -us -tc -b
            deps: check libcidr-dev
            package: ipaddrcheck
          - cmd: dpkg-buildpackage -uc -us -tc -b
            deps: libaudit-dev
            package: libnss-mapuser
          - cmd: dpkg-buildpackage -us -uc
            deps: libaudit-dev libpam-tacplus-dev libtac-dev libtacplus-map-dev
            package: libnss-tacplus
          - cmd: dpkg-buildpackage -us -uc
            deps: libaudit-dev libcap-dev libpam-dev
            package: libpam-radius-auth
          - cmd: dpkg-buildpackage -us -uc
            deps: autoconf-archive libaudit-dev libpam-dev libssl-dev libtacplus-map-dev
            package: libpam-tacplus
          - cmd: dpkg-buildpackage -us -uc
            deps: autoconf-archive libaudit-dev
            package: libtacplus-map
          - cmd: dpkg-buildpackage -us -uc
            package: live-boot
          - cmd: dpkg-buildpackage -us -uc
            deps: bison libncurses5-dev
            package: vyatta-bash
          - cmd: dpkg-buildpackage -us -uc
            deps: libpci-dev
            package: vyatta-biosdevname
          - cmd: dpkg-buildpackage -uc -us -tc -b
            deps: bison flex libboost-filesystem-dev libglib2.0-dev
            package: vyatta-cfg
          - cmd: dpkg-buildpackage -uc -us -tc -b
            deps: dh-virtualenv
            package: vyos-http-api-tools
    timeout-minutes: 10
  build-nocontainer:
    name: Build (no container)
    runs-on: ${{ matrix.runner_label }}
    steps:
      - name: Install dependencies
        run: |
          set -eux
          python3 -m pip install toml
          sudo apt-get update
          sudo apt-get --no-install-recommends --yes install \
            devscripts \
            equivs \
            python3-toml \
            python3-tomli
      - name: Download patch files
        env:
          GH_TOKEN: ${{ secrets.TBM_VYOS_PATCH_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "TBM_VYOS_PATCH_TOKEN is required to read techbymatt/tbm-vyos-patch" >&2
            exit 1
          fi

          sudo apt update
          sudo apt install --no-install-recommends --yes gh

          mkdir patch/
          for file in \
            vyos-1x_changes.patch \
            vyos-1x_new.patch \
            vyos-build_changes.patch \
            vyos-build_new.patch; do
            gh api \
              --header "Accept: application/vnd.github.raw" \
              "/repos/techbymatt/tbm-vyos-patch/contents/${file}" \
              > "patch/${file}"
          done

          echo ""
          echo "Contents of $(pwd)/patch:"
          ls -halp patch/
      - name: Checkout the vyos-build repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: vyos-build
          ref: rolling
          repository: vyos/vyos-build
      - id: patch_vyos_build
        name: Patch vyos-build
        run: |
          patch -p1 < ../patch/vyos-build_changes.patch
          patch -p1 < ../patch/vyos-build_new.patch
        working-directory: vyos-build
      - name: Setup golang
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.4"
      - name: Build the package
        working-directory: vyos-build/scripts/package-build/${{ matrix.package }}
        run: |
          python3 build.py
        timeout-minutes: 120
      - name: Upload the .deb files as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: ${{ matrix.package }}
          path: |
            vyos-build/scripts/package-build/${{ matrix.package }}/*.changes
            vyos-build/scripts/package-build/${{ matrix.package }}/*.deb
            vyos-build/scripts/package-build/${{ matrix.package }}/*.dsc
            vyos-build/scripts/package-build/${{ matrix.package }}/*.tar.bz2
            vyos-build/scripts/package-build/${{ matrix.package }}/*.tar.gz
            vyos-build/scripts/package-build/${{ matrix.package }}/*.tar.xz
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        package:
          - owamp
          - strongswan
        include:
          - arch: amd64
            runner_label: ubuntu-24.04
          - arch: arm64
            runner_label: ubuntu-24.04-arm
    timeout-minutes: 10
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    name: Publish
    needs:
      - build
      - build-extra
      - build-nocontainer
    permissions:
      id-token: write
      pages: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the vyos-pkg repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Download the .deb file artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          path: packages/rolling
      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get --no-install-recommends --yes install \
            jq \
            createrepo-c \
            coreutils \
            gnupg2 \
            dpkg-dev
      - name: Insert environment variables
        run: |
          {
            echo GNUPGHOME="$(mktemp -d /tmp/pgpkeys-XXXXXX)"
            echo REPO_OWNER="$(echo "${GITHUB_REPOSITORY}" | cut -d/ -f1)"
            echo REPO_NAME="$(echo "${GITHUB_REPOSITORY}" | cut -d/ -f2)"
          } >> "$GITHUB_ENV"
      - id: import_gpg
        name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Confirm GPG key is loaded
        run: |
          gpg --list-keys | grep "${{ steps.import_gpg.outputs.fingerprint }}"
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
      - name: Build .deb repository
        run: |
          export GPG_FINGERPRINT="${{ steps.import_gpg.outputs.fingerprint }}"
          export ORIGIN="${{ steps.import_gpg.outputs.name }}"
          sudo chown -R "$(whoami):$(whoami)" _site/
          scripts/build_repo.sh
      - name: Delete scripts/ repo
        run: |
          rm -r scripts
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
    timeout-minutes: 10
name: Repository
on:
  schedule:
    - cron: "0 4 1,8,15,22,29 * *"
  workflow_dispatch:
permissions:
  contents: read
