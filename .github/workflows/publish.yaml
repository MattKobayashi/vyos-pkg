---
jobs:
  build-packages:
    container:
      env:
        TZ: Australia/Brisbane
      image: vyos/vyos-build:current@sha256:0457a14f80d1cc012319d31155b7bae19f44f3dd98d535ae45d7008b6db9ffa9
    name: Build packages
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the vyos-build repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          path: vyos-build
          ref: current
          repository: vyos/vyos-build
      - name: Setup golang
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: "1.25.4"
      - name: Build the package
        working-directory: vyos-build/scripts/package-build/${{ matrix.package }}
        run: |
          set -eux
          sudo apt-get update
          python3 build.py
      - name: Upload the .deb files as artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          if-no-files-found: error
          name: ${{ matrix.package }}
          path: vyos-build/scripts/package-build/${{ matrix.package }}/*.deb
    strategy:
      fail-fast: true
      matrix:
        package:
          - amazon-cloudwatch-agent
          - amazon-ssm-agent
          - aws-gwlbtun
          - bash-completion
          - blackbox_exporter
          - ddclient
          - dropbear
          - ethtool
          - frr
          - frr_exporter
          - hostap
          - hsflowd
          - isc-dhcp
          - keepalived
          - libnss-mapuser
          - libpam-radius-auth
          - linux-kernel
          - ndppd
          - net-snmp
          - netfilter
          - node_exporter
          - openvpn-otp
          - podman
          - pyhumps
          - radvd
          - strongswan
          - tacacs
          - telegraf
          - udp-broadcast-relay
          - unionfs-fuse
          - vpp
          - vyos-1x
          - waagent
          - wide-dhcpv6
          - xen-guest-agent
          - zerotier-one
    timeout-minutes: 120
  build-packages-nocontainer:
    name: Build packages
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: |
          set -eux
          python3 -m pip install toml
          sudo apt-get update
          sudo apt-get --no-install-recommends --yes install \
            devscripts \
            equivs \
            python3-toml \
            python3-tomli
      - name: Checkout the vyos-build repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          path: vyos-build
          ref: current
          repository: vyos/vyos-build
      - name: Setup golang
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: "1.25.4"
      - name: Build the package
        working-directory: vyos-build/scripts/package-build/${{ matrix.package }}
        run: |
          set -eux
          python3 build.py
      - name: Upload the .deb files as artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          if-no-files-found: error
          name: ${{ matrix.package }}
          path: vyos-build/scripts/package-build/${{ matrix.package }}/*.deb
    strategy:
      fail-fast: false
      matrix:
        package:
          - owamp
    timeout-minutes: 120
  publish-repo:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    name: Create .deb repository
    needs:
      - build-packages
      - build-packages-nocontainer
    permissions:
      id-token: write
      pages: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the vyos-pkg repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Download the .deb file artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          merge-multiple: true
          path: packages/current
      - name: Install required packages
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get --no-install-recommends --yes install \
            jq \
            createrepo-c \
            coreutils \
            gnupg2 \
            dpkg-dev
      - name: Insert environment variables
        run: |
          set -eux
          echo GNUPGHOME="$(mktemp -d /tmp/pgpkeys-XXXXXX)" >> $GITHUB_ENV
          echo REPO_OWNER="$(echo ${GITHUB_REPOSITORY} | cut -d/ -f1)" >> $GITHUB_ENV
          echo REPO_NAME="$(echo ${GITHUB_REPOSITORY} | cut -d/ -f2)" >> $GITHUB_ENV
      - id: import_gpg
        name: Import GPG key
        uses: step-security/ghaction-import-gpg@69c854a83c7f79463f8bdf46772ab09826c560cd # v6.3.1
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Confirm GPG key is loaded
        run: |
          set -eux
          gpg --list-keys | grep $(echo "${{ steps.import_gpg.outputs.fingerprint }}")
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
      - name: Build .deb repository
        run: |
          set -eux
          export GPG_FINGERPRINT="${{ steps.import_gpg.outputs.fingerprint }}"
          export ORIGIN="${{ steps.import_gpg.outputs.name }}"
          sudo chown -R $(whoami):$(whoami) _site/
          scripts/build_repo.sh
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
    timeout-minutes: 10
name: "Publish TBM VyOS Package Repository"
on:
  schedule:
    - cron: "0 8 * * 0"
  workflow_dispatch:
permissions:
  contents: read
